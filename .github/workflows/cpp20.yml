name: C++20 build and tests

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zig-cpp20:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Zig development image
        run: docker build -f Dockerfile.dev -t darkeden-dev .
      - name: Debug contract and lifecycle tests
        run: bash tools/devbuild.sh test
      - name: Compile every production target
        run: bash tools/devbuild.sh build

  websocket-gateway:
    runs-on: ubuntu-24.04
    # A cold build (no cache hit) compiles the dependency tree twice: once
    # for clippy, once for the tests.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/server/websocketproxyserver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/server/websocketproxyserver
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
