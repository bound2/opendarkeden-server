# Local development override. Compose loads this alongside docker-compose.yml,
# which already runs the WebSocket gateway (odk-websocket) and publishes it
# on 127.0.0.1:8080. The browser client is served by the client repository's
# own compose file (opendarkeden-client/docker/docker-compose.yml), which
# joins this stack's network as odk-web.
services:
  odk-server:
    build:
      args:
        BUILD_TYPE: Debug
        BUILD_JOBS: "8"
